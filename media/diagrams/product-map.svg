<svg xmlns="http://www.w3.org/2000/svg" width="640" height="550" viewBox="0 0 640 550" role="img" aria-labelledby="title desc">
  <title id="title">Zafiro product map</title>
  <desc id="desc">Garden Planner and Isle Lab use the shared Zafiro 3D foundation for rendering, runtime lifecycle and reusable scene capabilities. Plant Atlas is an independent multilingual content product with its own publishing lifecycle.</desc>
  <rect width="640" height="550" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171717">
    <text x="32" y="52" font-size="30" font-weight="700">Zafiro product map</text>
    <line x1="32" y1="76" x2="608" y2="76" stroke="#d9d9d9"/>
    <rect x="32" y="104" width="276" height="112" rx="8" fill="#f5f5f3"/>
    <text x="52" y="149" font-size="27" font-weight="700">Garden Planner</text>
    <text x="52" y="187" font-size="24" fill="#525252">Garden design</text>
    <rect x="332" y="104" width="276" height="112" rx="8" fill="#f5f5f3"/>
    <text x="352" y="149" font-size="27" font-weight="700">Isle Lab</text>
    <text x="352" y="187" font-size="24" fill="#525252">World-building</text>
    <path d="M170 280 V226 M162 238 L170 226 L178 238 M470 280 V226 M462 238 L470 226 L478 238" fill="none" stroke="#525252" stroke-width="2"/>
    <text x="273" y="254" font-size="23" fill="#525252">supports</text>
    <rect x="32" y="280" width="576" height="115" rx="8" fill="#202621"/>
    <text x="52" y="322" font-size="27" font-weight="700" fill="#ffffff">Shared Zafiro 3D foundation</text>
    <text x="52" y="358" font-size="23" fill="#eeeeee">Rendering · lifecycle · scene capabilities</text>
    <rect x="32" y="423" width="576" height="101" rx="8" fill="#ffffff" stroke="#888888"/>
    <text x="52" y="462" font-size="27" font-weight="700">Plant Atlas</text>
    <text x="52" y="499" font-size="24" fill="#525252">Independent content and publishing</text>
  </g>
</svg>
